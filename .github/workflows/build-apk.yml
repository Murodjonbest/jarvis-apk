name: APK yig'ish
on:
  push:
    branches: [main]
    paths-ignore: ['.github/workflows/oqi.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Veb qismini yig'ish
        run: |
          npm ci
          npm run build
          npx cap sync android
      - name: Internetsiz "Jarvis" so'zini tanish modeli (Vosk)
        run: |
          curl -sSL -o /tmp/m.zip https://alphacephei.com/vosk/models/vosk-model-small-en-us-0.15.zip
          unzip -oq /tmp/m.zip -d /tmp/m
          D=android/app/src/main/assets/vosk-model; rm -rf $D; mkdir -p $D
          cp -r /tmp/m/vosk-model-small-en-us-0.15/* $D/
          echo "en-small-015-v1" > $D/uuid
          pip install -q vosk
          python3 -c "from vosk import Model, KaldiRecognizer; m=Model('$D'); KaldiRecognizer(m,16000,'[\"jarvis\", \"hey jarvis\", \"[unk]\"]'); print('GRAMMAR-CHECK-DONE')" 2>&1 | grep -i "missing\|ignor\|GRAMMAR" || true
      - name: Imzo kaliti (doimiy — yangilanishlar ustidan o'rnatilsin)
        uses: actions/cache@v4
        with:
          path: ~/jarvis-key
          key: jarvis-signing-key-v1
      - name: Internetsiz "Jarvis" so'zini tanish modeli (Vosk)
        run: |
          curl -sSL -o /tmp/m.zip https://alphacephei.com/vosk/models/vosk-model-small-en-us-0.15.zip
          unzip -oq /tmp/m.zip -d /tmp/m
          D=android/app/src/main/assets/vosk-model; rm -rf $D; mkdir -p $D
          cp -r /tmp/m/vosk-model-small-en-us-0.15/* $D/
          echo "en-small-015-v1" > $D/uuid
          pip install -q vosk
          python3 -c "from vosk import Model, KaldiRecognizer; m=Model('$D'); KaldiRecognizer(m,16000,'[\"jarvis\", \"hey jarvis\", \"[unk]\"]'); print('GRAMMAR-CHECK-DONE')" 2>&1 | grep -i "missing\|ignor\|GRAMMAR" || true
      - name: Imzo kalitini tayyorlash
        env:
          KS_B64: ${{ secrets.JARVIS_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.JARVIS_KEY_PASS }}
        run: |
          mkdir -p ~/jarvis-key
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > ~/jarvis-key/jarvis.keystore; echo "$KS_PASS" > ~/jarvis-key/pass
          elif [ ! -f ~/jarvis-key/jarvis.keystore ]; then
            P=$(openssl rand -hex 16); echo "$P" > ~/jarvis-key/pass
            keytool -genkeypair -keystore ~/jarvis-key/jarvis.keystore -alias jarvis -keyalg RSA -keysize 2048 -validity 10000 -storepass "$P" -keypass "$P" -dname "CN=Jarvis, C=UZ"
          fi
          echo "::add-mask::$(cat ~/jarvis-key/pass)"
          echo "JARVIS_KEYSTORE=$HOME/jarvis-key/jarvis.keystore" >> $GITHUB_ENV
          echo "JARVIS_KEY_PASS=$(cat ~/jarvis-key/pass)" >> $GITHUB_ENV
      - name: APK yig'ish
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace
          cp app/build/outputs/apk/release/app-release.apk ../Jarvis.apk
      - name: Kompyuter versiyasi (Windows) va avtomatik yangilanish paketi
        run: |
          V=2.0.${{ github.run_number }}
          node -e "const f='desktop/app/package.json';const p=JSON.parse(require('fs').readFileSync(f,'utf8'));p.version='$V';require('fs').writeFileSync(f,JSON.stringify(p))"
          tar -czf desktop/app/vendor/vosk-model.tar.gz -C /tmp/m vosk-model-small-en-us-0.15
          mkdir -p desktop/app/vendor/ffmpeg && curl -sSL https://github.com/eugeneware/ffmpeg-static/releases/download/b6.0/ffmpeg-win32-x64.gz | gunzip > desktop/app/vendor/ffmpeg/ffmpeg.exe && ls -la desktop/app/vendor/ffmpeg
          rm -rf desktop/app/oqi && cp -r oqi/app desktop/app/oqi && rm -f desktop/app/oqi/vendor/vosk*
          (cd desktop/app && zip -qr ../../jarvis-desktop-update.zip . -x 'vendor/pyodide/*' -x 'vendor/model/*' -x 'vendor/vosk-model.tar.gz' -x 'vendor/ffmpeg/*')
          curl -sSL -o /tmp/el.zip https://github.com/electron/electron/releases/download/v45.3.0/electron-v45.3.0-win32-x64.zip
          rm -rf /tmp/J && mkdir -p /tmp/J/Jarvis && unzip -q /tmp/el.zip -d /tmp/J/Jarvis
          mv /tmp/J/Jarvis/electron.exe /tmp/J/Jarvis/Jarvis.exe && rm -f /tmp/J/Jarvis/resources/default_app.asar
          mkdir -p /tmp/J/Jarvis/resources/app && cp -r desktop/app/. /tmp/J/Jarvis/resources/app/ && cp "desktop/O'QING.txt" /tmp/J/Jarvis/
          (cd /tmp/J && zip -qr "$GITHUB_WORKSPACE/Jarvis-Desktop.zip" Jarvis)
          ls -la Jarvis-Desktop.zip jarvis-desktop-update.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Jarvis-apk
          path: Jarvis.apk
      - name: Telefon uchun yuklab olish sahifasi (Releases)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.0.${{ github.run_number }}
          name: JARVIS v2.0.${{ github.run_number }}
          make_latest: true
          files: |
            Jarvis.apk
            Jarvis-Desktop.zip
            jarvis-desktop-update.zip
          body: |
            📱 **Telefon:** Jarvis.apk ni bosing → yuklab oling → oching → "Noma'lum manbalardan o'rnatish"ga ruxsat bering → O'rnatish.
            💻 **Kompyuter:** Jarvis-Desktop.zip ni yuklab oling → ochib (Extract) → Jarvis\Jarvis.exe. Keyingi yangilanishlar o'zi keladi.
            Doim eng so'nggisi: https://github.com/${{ github.repository }}/releases/latest
