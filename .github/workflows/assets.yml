name: Loyiha assets
on:
  workflow_dispatch:
  push:
    paths: ['assets/**', '.github/workflows/assets.yml']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.13' }
      - name: Yuklab olish (Poly Haven CC0)
        run: python3 assets/fetch.py "$PWD/out/loyiha"
      - name: Blender (bpy)
        run: pip install bpy==5.3.* || pip install bpy
      - name: Kutubxona .blend
        run: python3 -c "import sys; sys.argv=['x','--','$PWD/out/loyiha']; exec(open('assets/mklib.py').read())"
      - name: Zip
        run: |
          cd out/loyiha && rm -rf _gltf && du -sh * && zip -qr ../loyiha-assets.zip . && ls -la ..
      - name: Sinov render
        run: |
          mkdir -p prev && node assets/testgen.js "$PWD/out/loyiha" "$PWD/prev"
          for f in prev/*.py; do timeout 1500 python3 -c "exec(open('$f').read())" 2>&1 | grep -E "JARVIS|Error|Trace|rror:" | tail -25 || true; done
          ls -la prev
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete loyiha-assets -y --cleanup-tag 2>/dev/null || true
          gh release create loyiha-assets out/loyiha-assets.zip prev/*.png --title "Loyiha kutubxonasi" --notes "Jarvis Loyiha: Poly Haven CC0 resurslari (HDRI, PBR, modellar) + sinov renderlar" --prerelease
