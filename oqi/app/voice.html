<!doctype html>
<html lang="uz"><head><meta charset="utf-8"><title>Jarvis ovozi</title></head>
<body style="background:#03080f;color:#3fd2ff;font:14px 'Segoe UI',sans-serif;padding:14px">🔊 Jarvis ovozi — bu oyna yig'ilgan holda ishlaydi, yopmang.
<div id="st" style="color:#8aa;margin-top:6px;font-size:12px"></div>
<script>
'use strict';
// Jarvis kompyuter dasturi bu sahifani DevTools protokoli orqali boshqaradi:
// window.jvSay({text, voice, rate}) — matnni Edge'ning tabiiy o'zbek ovozida (Madina/Sardor) aytadi.
let V = [];
function load() { V = speechSynthesis.getVoices(); document.getElementById('st').textContent = 'Ovozlar: ' + (V.filter(v => /^uz/i.test(v.lang)).map(v => v.name.replace(/^Microsoft /, '')).join(', ') || '—'); return V; }
speechSynthesis.onvoiceschanged = load; load();
window.jvVoices = async () => { for (let i = 0; i < 20 && !load().some(v => /^uz/i.test(v.lang)); i++) await new Promise(r => setTimeout(r, 250)); return V.filter(v => /^(uz|ru)/i.test(v.lang)).map(v => ({ name: v.name, lang: v.lang })); };
function chunks(t) { const out = []; let cur = ''; (t.match(/[^.!?…]+[.!?…]*\s*/g) || [t]).forEach(p => { if ((cur + p).length > 700 && cur) { out.push(cur); cur = ''; } cur += p; }); if (cur.trim()) out.push(cur); return out; }
let gen = 0; const Q = []; let busy = false;
window.jvStop = () => { gen++; speechSynthesis.cancel(); Q.splice(0).forEach(x => x.res({ ok: true, stopped: true })); return true; };
// navbat: Jarvis keyingi gapni oldindan yuborib qo'yadi — gaplar orasida pauza bo'lmaydi
window.jvSay = r => new Promise(res => { Q.push({ r, res, g: gen }); pump(); });
async function pump() { if (busy) return; busy = true; try { while (Q.length) { const x = Q.shift(); if (x.g !== gen) { x.res({ ok: true, stopped: true }); continue; } x.res(await sayOne(x.r, x.g)); } } finally { busy = false; } }
async function sayOne(r, g) {
  await window.jvVoices();
  const want = String(r.voice || 'madina').toLowerCase(); const uz = V.filter(x => /^uz/i.test(x.lang));
  const v = uz.find(x => x.name.toLowerCase().includes(want)) || uz.find(x => /natural|online/i.test(x.name)) || uz[0];
  if (!v) return { ok: false, error: 'no_uz_voice' };
  for (const p of chunks(String(r.text || ''))) {
    if (g !== gen) return { ok: true, stopped: true };
    const res = await new Promise(done => {
      const u = new SpeechSynthesisUtterance(p); u.voice = v; u.lang = v.lang; u.rate = r.rate || 1; let started = false;
      u.onstart = () => { started = true; }; u.onend = () => done({ ok: true });
      u.onerror = e => done({ ok: /interrupted|canceled/.test(e.error), stopped: /interrupted|canceled/.test(e.error), error: e.error });
      speechSynthesis.speak(u);
      setTimeout(() => { if (!started && !speechSynthesis.speaking) done({ ok: false, error: 'not_started' }); }, 8000);
    });
    if (!res.ok || res.stopped) return res;
  }
  return { ok: true, voice: v.name };
}
</script></body></html>
